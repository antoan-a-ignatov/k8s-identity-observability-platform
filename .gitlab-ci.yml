workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - lint
  - build
  - scan
  - push

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check app/

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t "$IMAGE_TAG" app/
    - docker save "$IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --timeout 10m --input image.tar --severity HIGH,CRITICAL
  needs: ["build"]

push:
  stage: push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$IMAGE_TAG"
  needs: ["build", "scan"]
  only:
    - main

keycloak-build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - changes:
        - docker/keycloak/**
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:keycloak-$CI_COMMIT_SHORT_SHA" -f docker/keycloak/Dockerfile docker/keycloak
    - docker save "$CI_REGISTRY_IMAGE:keycloak-$CI_COMMIT_SHORT_SHA" -o keycloak-image.tar
  artifacts:
    paths:
      - keycloak-image.tar
    expire_in: 1 hour

keycloak-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - changes:
        - docker/keycloak/**
  script:
    - trivy image --scanners vuln --pkg-types os --input keycloak-image.tar --severity HIGH,CRITICAL
  needs: ["keycloak-build"]

keycloak-push:
  stage: push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - docker/keycloak/**
  script:
    - docker load -i keycloak-image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:keycloak-$CI_COMMIT_SHORT_SHA"
  needs: ["keycloak-build", "keycloak-scan"]
