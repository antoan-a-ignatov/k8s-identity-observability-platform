apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/antoan-a-ignatov/k8s-identity-observability-platform.git
    targetRevision: main
    path: manifests/identity
    directory:
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
