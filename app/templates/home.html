<!doctype html>
<html>
<head><title>Platform App</title></head>
<body>
  <h1>Platform App</h1>

    <p>Logged in as {{ user.preferred_username }}</p>
    <a href="/protected">Protected page</a> | <a href="/logout">Logout</a>

  {% endif %}
</body>
</html>
